<style>
/* Layout: glass sidebar + sticky top bar, one content column. Same deep-blue frosted language as ReBump. */
/* EasyIntake palette: orange #F05A28 on warm cream, navy ink. Light default, navy night mode. */
:root{
  --bg:#FBF8F2;--glow1:rgba(240,90,40,.20);--glow2:rgba(255,170,110,.22);--glow3:rgba(13,31,61,.07);

  --line:rgba(13,31,61,.11);--line2:rgba(13,31,61,.20);--tint:rgba(240,90,40,.10);--tint2:rgba(240,90,40,.06);
  --fg:#0D1F3D;--muted:#3D4A66;--faint:#8A5F45;--vgrad:linear-gradient(var(--fg),var(--fg));
  --accent:#F05A28;--accent-ink:#FFFFFF;--accent-soft:rgba(240,90,40,.12);--accent2:#EF7B45;
  --good:#0B8F63;--good-soft:rgba(11,143,99,.12);--warn:#C2410C;--warn-soft:rgba(240,90,40,.12);--bad:#D03A4A;--bad-soft:rgba(208,58,74,.12);
  --shadow:0 12px 36px -18px rgba(120,60,20,.35);--blur:blur(22px) saturate(160%);
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--f-body:"Manrope","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --surface:rgba(255,120,50,.07);--surface2:rgba(255,120,50,.10);--solid:#170D08;--hi:rgba(255,170,110,.14);
  --line:rgba(255,140,80,.20);--line2:rgba(255,140,80,.34);--tint:rgba(255,122,69,.18);--tint2:rgba(255,122,69,.09);
  --fg:#FFF3E8;--muted:#F3CDB4;--faint:#D9A07C;--vgrad:linear-gradient(180deg,#FFFFFF,#FFB98F);
  --accent:#FF6A2B;--accent-ink:#1A0800;--accent-soft:rgba(255,106,43,.18);--accent2:#FFA05E;
  --good:#3FDDAA;--good-soft:rgba(63,221,170,.15);--warn:#FFC24D;--warn-soft:rgba(255,106,43,.16);--bad:#FF7C8C;--bad-soft:rgba(255,124,140,.16);
  --shadow:0 18px 50px -16px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080504;--glow1:rgba(240,90,40,.38);--glow2:rgba(255,140,60,.14);--glow3:rgba(200,60,20,.22);
  --surface:rgba(255,120,50,.07);--surface2:rgba(255,120,50,.10);--solid:#170D08;--hi:rgba(255,170,110,.14);
  --line:rgba(255,140,80,.20);--line2:rgba(255,140,80,.34);--tint:rgba(255,122,69,.18);--tint2:rgba(255,122,69,.09);
  --fg:#FFF3E8;--muted:#F3CDB4;--faint:#D9A07C;--vgrad:linear-gradient(180deg,#FFFFFF,#FFB98F);
  --accent:#FF6A2B;--accent-ink:#1A0800;--accent-soft:rgba(255,106,43,.18);--accent2:#FFA05E;
  --good:#3FDDAA;--good-soft:rgba(63,221,170,.15);--warn:#FFC24D;--warn-soft:rgba(255,106,43,.16);--bad:#FF7C8C;--bad-soft:rgba(255,124,140,.16);
  --shadow:0 18px 50px -16px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 560px at 8% -8%,var(--glow1),transparent 62%),radial-gradient(760px 520px at 100% 2%,var(--glow2),transparent 58%),radial-gradient(700px 500px at 60% 110%,var(--glow3),transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.faint{color:var(--faint)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}

.grp{font-size:11.5px;color:var(--faint);padding:16px 10px 4px;font-weight:600;letter-spacing:.04em}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--muted);text-align:left;width:100%;font-weight:500;transition:background .2s,color .2s}
.nav:hover{background:var(--surface2);color:var(--fg)}
.nav.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 8px 20px -10px var(--accent)}.nav.on .cnt{background:rgba(255,255,255,.28);color:inherit}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--surface2);padding:1px 8px;border-radius:99px;color:var(--muted)}
.foot{margin-top:auto;padding:12px 8px 2px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}

.main{min-width:0;display:flex;flex-direction:column}

.grow{flex:1}

.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.ph .t{flex:1;min-width:240px}
.ph h1{font-size:32px;line-height:1.12}.ph p{margin:6px 0 0;color:var(--muted);max-width:64ch}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);padding:8px 15px;border-radius:12px;font-weight:500;white-space:nowrap;transition:box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--accent);box-shadow:0 8px 22px -10px var(--accent)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:9px}
.card{background:linear-gradient(150deg,var(--hi),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:20px;min-width:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.pad{padding:22px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.ch h3{font-size:17px;flex:1}
.grid{display:grid;gap:20px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpi{padding:20px 22px;display:flex;flex-direction:column;gap:4px;transition:transform .25s,border-color .25s}
.kpi:hover{transform:translateY(-3px);border-color:var(--accent)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font:600 34px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;background:var(--vgrad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.kpi .d{font-size:12.5px;color:var(--muted)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);margin-top:6px}
.src:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.scroll{overflow-x:auto}

.tbl tr:last-child td{border-bottom:0}.tbl tbody tr:hover{background:var(--tint2)}.tbl tbody tr.click{cursor:pointer}
.r{text-align:right}
.cell{display:flex;align-items:center;gap:10px;min-width:0}.cell b{font-weight:600;display:block}.cell span{color:var(--faint);font-size:12.5px;display:block}.cell .av{display:grid;color:#fff;font-size:12px}

.seg{display:inline-flex;background:var(--tint);border-radius:13px;padding:3px;gap:2px;flex-wrap:wrap}

.seg button.on{background:var(--solid);color:var(--fg);box-shadow:0 2px 10px -4px rgba(0,0,0,.25)}
.sel{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:7px 11px}
.sel option{color:#0D1F3D}
.funnel{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:14px;align-items:center}
.frow .bar{height:14px}.frow small{color:var(--faint)}
.reasons{display:flex;flex-direction:column;gap:14px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:6px 14px}.rrow .bar{grid-column:1/-1}
.banner{display:flex;gap:12px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--accent-soft);color:var(--fg);border:1px solid var(--line2);flex-wrap:wrap}
.banner .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,5,4,.6);backdrop-filter:blur(6px);display:flex;justify-content:flex-end}
.sheet{width:min(560px,100%);height:100%;background:linear-gradient(180deg,var(--tint),transparent 40%),var(--solid);border-left:1px solid var(--line2);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}.sh h3{flex:1;font-size:19px}
.sb{padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:10px 16px}.kv span{color:var(--faint)}.kv b{font-weight:500}
.tl{display:flex;flex-direction:column;gap:0}

.tl div.done{color:var(--fg)}.tl div.done i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent)}
.note{background:var(--tint2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ph h1,.card h3,.sb h3{text-transform:capitalize}.sh h3{text-transform:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:var(--tint2);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.khead{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.kbody{display:flex;flex-direction:column;gap:10px}
.kcard{background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .2s,border-color .2s;box-shadow:var(--shadow)}
.kcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.kmeta{color:var(--faint);font-size:12.5px}.kreel{font-size:13px}
.kreason{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 8px}
.kfoot{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:2px}
.list{display:flex;flex-direction:column}.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.li:last-child{border-bottom:0}.li .tx{flex:1;min-width:0}.li .tx span{display:block;color:var(--muted);font-size:12.5px}.li:hover .tx b{color:var(--accent)}.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.acc{background:var(--accent)}
.flag{font-size:16px;margin-right:6px}.loc{white-space:nowrap}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.rcard{padding:12px;display:flex;flex-direction:column;gap:12px;transition:transform .25s,border-color .25s}.rcard:hover{transform:translateY(-3px);border-color:var(--accent)}

.rtitle{font:600 14px/1.25 var(--f-display);text-shadow:0 1px 6px rgba(0,0,0,.4)}

.info:after{content:attr(data-tip);position:absolute;right:-8px;left:auto;top:calc(100% + 8px);width:max-content;max-width:240px;padding:7px 12px;border-radius:10px;background:var(--solid);color:var(--fg);border:1px solid var(--line2);box-shadow:var(--shadow);font:500 12.5px/1.4 var(--f-body);letter-spacing:0;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}

.callcard{cursor:pointer;transition:transform .25s,border-color .25s}.callcard:hover{transform:translateY(-3px);border-color:var(--accent)}

.lbln{display:none}

 else if(t.dataset.more){S.view="outcomes";S.stage=t.dataset.more;S.srcf="all";S.leadView="list";render();var g=$("stg");if(g)g.scrollIntoView({block:"start"})}
 else if(t.dataset.v){S.view=t.dataset.v;S.stage="all";S.q="";render();window.scrollTo(0,0)}

 else if(t.id==="mn"){document.body.classList.toggle("open")}
 else if(t.id==="cl"||t.id==="ovb"){$("ov").innerHTML=""}
 else if(t.id==="rec"){toast("Recording opens in the meeting tool once it is connected")}

// 🚀 SUPABASE LIVE INTEGRATION
// =========================================================================
window.supa = null;
if (window.supabase && window.PORTAL_CONFIG && window.PORTAL_CONFIG.SUPABASE_ANON_KEY && !window.PORTAL_CONFIG.SUPABASE_ANON_KEY.includes("PASTE_")) {
  try {
    window.supa = window.supabase.createClient(window.PORTAL_CONFIG.SUPABASE_URL, window.PORTAL_CONFIG.SUPABASE_ANON_KEY);
  } catch(e) {
    console.warn("Supabase client init error:", e);
  }
}

function stageNameToIdx(st) {
  if (!st) return 0;
  var s = String(st).toLowerCase();
  if (s.includes("payout")) return 9;
  if (s.includes("enrol")) return 8;
  if (s.includes("arrive")) return 7;
  if (s.includes("flight")) return 6;
  if (s.includes("visa")) return 5;
  if (s.includes("offer")) return 4;
  if (s.includes("appl")) return 3;
  if (s.includes("meet")) return 2;
  if (s.includes("qualif")) return 1;
  return 0;
}

window.REAL_MESSAGES_CACHE = {};

window.IN_FLIGHT_FETCHES = window.IN_FLIGHT_FETCHES || {};
async function fetchRealMessages(lead, forceRefresh) {
  if (!lead) return [];
  var key = lead.phone || lead.handle || lead.id;
  var cache = window.REAL_MESSAGES_CACHE = window.REAL_MESSAGES_CACHE || {};
  if (!forceRefresh && cache[key] !== undefined) return cache[key];
  if (!forceRefresh && window.IN_FLIGHT_FETCHES[key]) return window.IN_FLIGHT_FETCHES[key];

  var fetchPromise = (async function() {
    var allFound = [];

    // 1. Load from Supabase first
    if (window.supa) {
      try {
        var cleanPhone = (lead.phone || "").replace(/\D/g, '');
        var filters = [];
        if (cleanPhone) {
          filters.push("lead_phone.eq." + cleanPhone);
          if (cleanPhone.length >= 10) filters.push("lead_phone.eq." + cleanPhone.slice(-10));
        }
        var h = (lead.handle ? lead.handle.replace('@','').trim() : '');
        if (h && h !== 'lead') {
          filters.push("ig_username.ilike.*" + h + "*");
        }
        if (lead.first && lead.first !== 'Student') {
          filters.push("ig_username.ilike.*" + lead.first.trim() + "*");
        }
        if (lead.id && lead.id.length > 20) {
          filters.push("lead_id.eq." + lead.id);
        }

        if (filters.length > 0) {
          var activeCreator = (lead.creator_name || (typeof window.getActiveCreator === 'function' ? window.getActiveCreator() : 'yeba')).toLowerCase();
          var mQuery = window.supa.from("messages").select("*").or(filters.join(","));
          if (activeCreator) {
            mQuery = mQuery.eq("creator_name", activeCreator);
          }
          var sRes = await mQuery.order("created_at", { ascending: true });
          if (sRes.data && sRes.data.length > 0) {
            allFound = sRes.data.map(function(m) {
              return {
                ch: m.channel || "Instagram",
                who: m.sender_name || (m.sender_role === "Student" ? (lead.first || "Student") : "Creator"),
                role: m.sender_role || "Student",
                dir: (m.sender_role === "Student" ? "in" : "out"),
                t: new Date(m.created_at || Date.now()),
                text: m.message_text
              };
            });
          }
        }
      } catch(e) { console.warn("Supabase check error:", e); }
    }

    // 2. Check GHL dynamically for missing or newer messages
    var cfg = window.PORTAL_CONFIG || {};
    if (cfg.GHL_TOKEN && cfg.GHL_LOCATION_ID) {
      try {
        var contactQuery = lead.ghl_contact_id ? ("contactId=" + encodeURIComponent(lead.ghl_contact_id)) : ("query=" + encodeURIComponent(lead.first || lead.handle || ""));
        var cUrl = "https://services.leadconnectorhq.com/conversations/search?" + contactQuery + "&locationId=" + encodeURIComponent(cfg.GHL_LOCATION_ID);
        var cResp = await fetch(cUrl, {
          headers: { "Authorization": "Bearer " + cfg.GHL_TOKEN, "Version": "2021-04-15" }
        });
        var cData = await cResp.json();
        var convs = cData.conversations || [];
        if (convs.length > 0) {
          var conv = convs[0];
          var convId = conv.id;
          var latestLocal = allFound.length > 0 ? allFound[allFound.length - 1].t.getTime() : 0;
          var convLast = conv.lastMessageDate ? new Date(conv.lastMessageDate).getTime() : 0;

          // If GHL has newer messages OR forceRefresh OR no messages locally yet
          if (convLast > latestLocal || forceRefresh || allFound.length === 0) {
            var mUrl = "https://services.leadconnectorhq.com/conversations/" + convId + "/messages?limit=50";
            var mResp = await fetch(mUrl, {
              headers: { "Authorization": "Bearer " + cfg.GHL_TOKEN, "Version": "2021-04-15" }
            });
            var mData = await mResp.json();
            var rawMsgs = (mData.messages && mData.messages.messages) || [];

            var existingDates = {};
            allFound.forEach(function(m) {
              existingDates[m.t.toISOString()] = true;
            });

            var toSave = [];
            rawMsgs.forEach(function(m) {
              var body = (m.body || m.text || "").trim();
              if (!body && m.attachments && m.attachments.length) {
                body = m.attachments[0];
              }
              if (!body) return;
              var dIso = new Date(m.dateAdded).toISOString();
              if (existingDates[dIso]) return; // Deduplicate

              var isIn = m.direction === "inbound";
              var sender = isIn ? (m.from || lead.first || "Student") : (m.from || "Yeba");
              var role = isIn ? "Student" : (sender.toLowerCase().includes("yeba") ? "Creator" : (m.source === "workflow" ? "Automation" : "Counselor"));
              var ch = (m.messageType === 'TYPE_INSTAGRAM' || (m.meta && m.meta.ig)) ? 'Instagram' : (m.messageType === 'TYPE_WHATSAPP' ? 'WhatsApp' : 'Instagram');
              var item = {
                ch: ch,
                who: sender,
                role: role,
                dir: isIn ? "in" : "out",
                t: new Date(m.dateAdded),
                text: body
              };
              allFound.push(item);
              existingDates[dIso] = true;
              toSave.push({
                channel: ch,
                sender_name: sender,
                sender_role: role,
                message_text: body,
                lead_phone: lead.phone || null,
                ig_username: lead.handle ? lead.handle.replace('@','') : lead.first,
                creator_name: (lead.creator_name || (typeof window.getActiveCreator === 'function' ? window.getActiveCreator() : 'yeba')),
                created_at: m.dateAdded
              });
            });

            if (window.supa && toSave.length > 0) {
              window.supa.from("messages").insert(toSave).then(function(){});
            }
          }
        }
      } catch(err) {
        console.warn("GHL auto-fetch error:", err);
      }
    }

    allFound.sort(function(a,b){ return a.t - b.t; });
    cache[key] = allFound;
    if (lead.phone) cache[lead.phone] = allFound;
    if (lead.handle) cache[lead.handle] = allFound;
    if (lead.id) cache[lead.id] = allFound;
    delete window.IN_FLIGHT_FETCHES[key];
    return allFound;
  })();

  window.IN_FLIGHT_FETCHES[key] = fetchPromise;
  return fetchPromise;
}
window.fetchRealMessages = fetchRealMessages;
window.getActiveCreator = function() {
  return (window.CURRENT_CREATOR || localStorage.getItem("easyintake_creator") || "yeba").toLowerCase();
};

window.setCurrentCreator = function(name) {
  window.CURRENT_CREATOR = (name || "yeba").toLowerCase();
  localStorage.setItem("easyintake_creator", window.CURRENT_CREATOR);
  window.REAL_MESSAGES_CACHE = {};
  if (typeof syncSupabaseLeads === "function") syncSupabaseLeads();
};

function parseLeadLocation(r) {
  var p = (r.phone || "").replace(/\D/g, "");
  if (p.startsWith("880")) return "Dhaka, Bangladesh";
  if (p.startsWith("92")) return "Lahore, Pakistan";
  if (p.startsWith("60")) return "Kuala Lumpur, Malaysia";
  if (p.startsWith("91")) return "Delhi, India";
  if (p.startsWith("971")) return "Dubai, UAE";
  if (p.startsWith("966")) return "Riyadh, Saudi Arabia";
  if (p.startsWith("44")) return "London, UK";

  var cf = (r.coming_from || "").trim();
  if (cf && cf !== "US" && cf !== "USA") {
    if (cf.includes(",")) return cf;
    var defaultCity = cf === "Pakistan" ? "Lahore" : cf === "Bangladesh" ? "Dhaka" : cf === "Malaysia" ? "Kuala Lumpur" : cf;
    return defaultCity + ", " + cf;
  }
  return "Not specified";
}

async function syncSupabaseLeads() {
  if (!window.supa) return;
  try {
    var activeCreator = window.getActiveCreator();
    var q = window.supa.from("leads").select("*");
    if (S.role !== "mgmt") {
      q = q.eq("creator_name", activeCreator);
    }
    var res = await q.order("created_at", { ascending: false });
    if (res.data && res.data.length > 0) {
      var realList = res.data.map(function(r, idx) {
        var sIdx = stageNameToIdx(r.current_stage);
        var d = new Date(r.created_at || Date.now());
        var reelSource = (r.lead_source && r.lead_source.toLowerCase().includes("video") && r.reel_id) ? r.reel_id : "dm";
        return {
          id: r.id || ("supa_" + idx),
          ghl_contact_id: r.ghl_contact_id || "",
          first: r.name || "Student",
          handle: r.ig_username ? ("@" + r.ig_username.replace('@','')) : (r.phone ? ("@" + r.phone.slice(-6)) : "@lead"),
          phone: r.phone || "",
          c: (r.creator_name === "shayan" ? "c2" : r.creator_name === "farah" ? "c3" : "c1"),
          creator_name: r.creator_name || activeCreator,
          reel: reelSource,
          date: d,
          stage: sIdx,
          end: null,
          email: !!r.email,
          intent: r.interest || "Admissions",
          msgs: 4,
          sent: "positive",
          level: r.level || "Postgraduate",
          from: parseLeadLocation(r),
          budget: r.budget || "RM 18,000 per year",
          acad: { now: r.current_studies || "Graduated", grade: r.grades || "Good", eng: r.english_test || "Not taken yet" },
          docs: r.documents_submitted || false,
          hold: false,
          egms: 50,
          status: STAGES[sIdx] || "in conversation",
          isReal: true
        };
      });

      var existingIds = {};
      realList.forEach(function(r) { existingIds[r.id] = true; if(r.phone) existingIds[r.phone] = true; });
      LEADS = realList;
      render();
    }
  } catch(e) {
    console.warn("Error fetching real leads:", e);
  }
}
window.syncSupabaseLeads = syncSupabaseLeads;

render();
syncSupabaseLeads();
setInterval(syncSupabaseLeads, 10000);
})();
</script>
